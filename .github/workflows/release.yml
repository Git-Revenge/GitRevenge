name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Dry run: build and package (unsigned) without publishing when this workflow changes.
  pull_request:
    paths: [.github/workflows/release.yml, build/linux/**, build/windows/**, build/darwin/**]
  # Build from a branch without publishing, optionally signing the Windows installer, to test
  # signing without a tag.
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows installer
        type: boolean
        default: true

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NFPM_VERSION: v2.48.0
  # The Chocolatey package that builds the Windows installer. Bumped by hand: Dependabot doesn't
  # follow Chocolatey. A package version there can't be replaced once it's published.
  NSIS_VERSION: 3.13.0

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          # Each Linux package is built on the oldest system it supports. The .deb's glibc and
          # WebKitGTK suit newer Ubuntu and Debian too. RHEL 9 only has WebKitGTK 4.0, and RHEL 10 only has
          # 4.1, from EPEL, so they can't share a package. AlmaLinux stands in for RHEL.
          - name: deb
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            packager: deb
            package: linux-amd64.deb
          - name: el9
            os: ubuntu-24.04
            container: almalinux:9
            platform: linux/amd64
            webkit_devel: webkit2gtk3-devel
            webkit: webkit2gtk3
            packager: rpm
            package: el9.x86_64.rpm
          - name: el10
            os: ubuntu-24.04
            container: almalinux:10
            platform: linux/amd64
            tags: webkit2_41
            webkit_devel: webkit2gtk4.1-devel
            webkit: webkit2gtk4.1
            packager: rpm
            package: el10.x86_64.rpm
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # macOS signing and notarization run only when the Apple secrets are configured;
    # otherwise the .dmg is published unsigned. Only this flag is job-wide: the secrets
    # themselves are scoped to the steps that use them, never to npm or go install steps.
    env:
      MAC_SIGNING: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
      # Windows signing, with the Certum certificate in SimplySign, runs for tags and for a
      # manual run that asks for it, when the Certum secrets are configured.
      WIN_SIGNING: ${{ (github.ref_type == 'tag' || inputs.sign == true) && secrets.CERTUM_USERNAME != '' && secrets.CERTUM_TOTP_SECRET != '' }}
      # A container runs as root, but the checkout belongs to the runner's user, so Go can't
      # read its VCS information.
      GOFLAGS: ${{ matrix.container && '-buildvcs=false' || '' }}
    steps:
      - name: Install GTK and WebKitGTK
        if: matrix.packager == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install build dependencies
        if: matrix.packager == 'rpm'
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          if [ "${{ matrix.name }}" = "el10" ]; then dnf install -y epel-release; fi
          dnf install -y git tar gzip xz gcc pkgconf-pkg-config gtk3-devel ${{ matrix.webkit_devel }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dryrun"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not semver"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stamp the version into wails.json so installer and bundle metadata match the tag.
          # Windows file versions must be numeric, so pre-release suffixes are dropped there.
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wails.json"));
            c.info.productVersion = process.argv[1].split("-")[0];
            fs.writeFileSync("wails.json", JSON.stringify(c, null, 2) + "\n");
          ' "$version"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis --version="$NSIS_VERSION" -y --no-progress
          # Chocolatey doesn't update PATH for later steps, and Wails only warns if makensis is missing.
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          # The installer must be built by the version asked for, not one already on the runner.
          # makensis prints 3.13.0 as "v3.13".
          got=$("/c/Program Files (x86)/NSIS/makensis.exe" -VERSION)
          if [ "$got" != "v${NSIS_VERSION%.0}" ]; then echo "::error::makensis is $got, not v${NSIS_VERSION%.0}"; exit 1; fi

      - name: Build
        shell: bash
        run: |
          args=(-clean -platform "${{ matrix.platform }}" -ldflags "-X github.com/git-revenge/gitrevenge/internal/version.Version=${{ steps.version.outputs.version }}")
          if [ "$RUNNER_OS" = "Windows" ]; then args+=(-nsis); fi
          # build/tags picks the grammars and keeps copyleft grammar code out (ADR 0015).
          tags="$(cat build/tags)"
          if [ -n "${{ matrix.tags }}" ]; then tags="${{ matrix.tags }},$tags"; fi
          args+=(-tags "$tags")
          wails build "${args[@]}"

      # The digest of the app as built, kept to compare with what the installer puts on disk
      # (see "Upgrade a 0.11.0 install"). It's the Authenticode digest, which leaves a
      # signature out, so it's the same before and after signing; a plain sha256 isn't.
      - name: Record the app that was built
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = "$((Get-AppLockerFileInformation -Path build\bin\gitrevenge.exe).Hash)"
          if ($hash -notmatch '^SHA256 0x[0-9A-F]{64}$') { throw "Couldn't take the built app's digest: '$hash'" }
          Write-Host "built: $hash"
          "BUILT_APP_HASH=$hash" >> $env:GITHUB_ENV

      # Signing waits until the build is done, so no npm or Go install step runs while the
      # SimplySign session is open. The action installs SimplySign Desktop, signs in with a
      # one-time code made from the TOTP secret, and puts signtool on the PATH.
      - name: Sign in to SimplySign
        id: certum
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          cert_sha1: ${{ secrets.CERTUM_CERT_SHA1 }}

      # Builds the installer again from the same files, this time with GITREVENGE_SIGN_SHA1 set,
      # so project.nsi signs the app, the uninstaller and the installer (see sign.cmd).
      - name: Sign the app and installer
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        working-directory: build/windows/installer
        shell: pwsh
        env:
          GITREVENGE_SIGN_SHA1: ${{ steps.certum.outputs.cert-thumbprint }}
        run: |
          if (-not $env:GITREVENGE_SIGN_SHA1) { throw 'SimplySign gave no certificate thumbprint' }
          makensis "-DARG_WAILS_AMD64_BINARY=..\..\bin\gitrevenge.exe" project.nsi
          if ($LASTEXITCODE) { throw "makensis failed with $LASTEXITCODE" }
          $installer = (Get-ChildItem ..\..\bin\*-installer.exe | Select-Object -First 1).FullName
          foreach ($file in '..\..\bin\gitrevenge.exe', $installer) {
            signtool verify /pa $file
            if ($LASTEXITCODE) { throw "$file is not signed" }
            $sig = Get-AuthenticodeSignature $file
            if ($sig.SignerCertificate.Thumbprint -ne $env:GITREVENGE_SIGN_SHA1 -or -not $sig.TimeStamperCertificate) {
              throw "$file is not signed and timestamped with the Certum certificate"
            }
            Write-Host "ok: $file signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Sign out of SimplySign
        if: always() && runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/*-installer.exe "dist/GitRevenge-${{ steps.version.outputs.version }}-windows-amd64-installer.exe"

      # 1.0 moved the install folder and renamed the uninstall key. Install 0.11.0, upgrade it
      # with this installer, and check that one install is left, in the new place, and that it
      # uninstalls cleanly. Also that the installer puts the gitrevenge command on the current
      # user's PATH and nobody else's (#895), that it starts the app, and that uninstalling
      # leaves the PATH exactly as it found it. A runner's PATH is several thousand characters,
      # which is what an installer that edits it carelessly would empty.
      - name: Upgrade a 0.11.0 install
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstall = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          $oldDir = "$env:ProgramFiles\Ris Adams\Git Revenge"
          $newDir = "$env:ProgramFiles\Git Revenge"
          function Check($ok, $what) { if (-not $ok) { throw "Failed: $what" } else { Write-Host "ok: $what" } }
          # A PATH as the registry holds it, with its variables unexpanded: the machine's, or
          # the current user's, which may have no Path value at all.
          function PathIn($where) {
            $key = Get-Item $where
            $kind = if ($key.GetValueNames() -contains 'Path') { "$($key.GetValueKind('Path'))" } else { 'none' }
            [pscustomobject]@{ Value = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames'); Kind = $kind }
          }
          function MachinePath { PathIn 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' }
          function UserPath { PathIn 'HKCU:\Environment' }
          function SamePath($a, $b) { $a.Value -ceq $b.Value -and $a.Kind -eq $b.Kind }
          # Runs a command in a shell of its own and waits for the installed app to appear.
          function StartsApp($shell, $arguments, $what) {
            Start-Process $shell -ArgumentList $arguments -WindowStyle Hidden
            for ($i = 0; $i -lt 30 -and -not (Get-Process gitrevenge -ErrorAction Ignore); $i++) { Start-Sleep 1 }
            $app = Get-Process gitrevenge -ErrorAction Ignore
            Check ($app -and $app.Path -eq "$newDir\gitrevenge.exe") $what
            $app | Stop-Process -Force
            $app | Wait-Process -Timeout 30
          }
          $machineBefore = MachinePath
          $pathBefore = UserPath
          Write-Host "The machine's PATH is $($machineBefore.Value.Length) characters ($($machineBefore.Kind)); the user's is $($pathBefore.Value.Length) ($($pathBefore.Kind))"

          gh release download v0.11.0 --repo $env:GITHUB_REPOSITORY --pattern 'GitRevenge-0.11.0-windows-amd64-installer.exe' --dir old
          Start-Process old\GitRevenge-0.11.0-windows-amd64-installer.exe -ArgumentList '/S' -Wait
          Check (Test-Path "$oldDir\gitrevenge.exe") '0.11.0 installed in the old folder'
          Check (Test-Path "$uninstall\Ris AdamsGit Revenge") '0.11.0 registered under the old key'

          $new = Get-ChildItem dist\*-windows-amd64-installer.exe | Select-Object -First 1
          Start-Process $new.FullName -ArgumentList '/S' -Wait
          Check (Test-Path "$newDir\gitrevenge.exe") 'installed in Program Files\Git Revenge'
          # The app the installer put on disk is the one the build step made (see "Record the
          # app that was built"): nothing swapped it on the way through signing and packing.
          $installed = "$((Get-AppLockerFileInformation -Path "$newDir\gitrevenge.exe").Hash)"
          Check ($installed -match '^SHA256 0x[0-9A-F]{64}$' -and $installed -eq $env:BUILT_APP_HASH) "the installed app is the one that was built ($installed)"
          Check (Test-Path "$uninstall\GitRevenge") 'registered under the GitRevenge key'
          Check (-not (Test-Path "$uninstall\Ris AdamsGit Revenge")) 'old key removed'
          Check (-not (Test-Path $oldDir)) 'old folder removed'
          Check (-not (Test-Path "$env:ProgramFiles\Ris Adams")) 'empty Ris Adams folder removed'
          Check (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Git Revenge.lnk") 'Start menu shortcut kept'
          if ($env:WIN_SIGNING -eq 'true') {
            foreach ($file in 'gitrevenge.exe', 'uninstall.exe') {
              Check ((Get-AuthenticodeSignature "$newDir\$file").Status -eq 'Valid') "installed $file is signed"
            }
          }

          # The launchers' folder is the user's PATH's last entry, and nothing else in it changed.
          # A user with no PATH of their own gets one, of the type Windows gives it.
          $added = if ($pathBefore.Value -eq '') { "$newDir\bin" }
            elseif ($pathBefore.Value.EndsWith(';')) { "$($pathBefore.Value)$newDir\bin;" }
            else { "$($pathBefore.Value);$newDir\bin" }
          $kindAfter = if ($pathBefore.Kind -eq 'none') { 'ExpandString' } else { $pathBefore.Kind }
          $path = UserPath
          Check ($path.Value -ceq $added -and $path.Kind -eq $kindAfter) "the user's PATH gained only $newDir\bin"
          Check (SamePath (MachinePath) $machineBefore) "the machine's PATH is untouched"
          # What a terminal opened now would have.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Check ((Get-Command gitrevenge).Source -eq "$newDir\bin\gitrevenge.cmd") 'PowerShell finds gitrevenge on the PATH'
          StartsApp 'cmd.exe' '/c gitrevenge' 'gitrevenge starts the app from cmd'
          StartsApp "$env:ProgramFiles\Git\bin\bash.exe" '-c gitrevenge' 'gitrevenge starts the app from Git Bash'

          Start-Process "$newDir\uninstall.exe" -ArgumentList '/S' -Wait
          # The uninstaller copies itself to a temp folder and returns before it's done.
          for ($i = 0; $i -lt 30 -and (Test-Path "$uninstall\GitRevenge"); $i++) { Start-Sleep 1 }
          Check (-not (Test-Path "$uninstall\GitRevenge")) 'uninstall removes the key'
          Check (SamePath (UserPath) $pathBefore) "uninstall leaves the user's PATH as it was before the install"
          Check (SamePath (MachinePath) $machineBefore) "uninstall leaves the machine's PATH as it was"
          Check (-not (Test-Path "$newDir\bin")) 'uninstall removes the launchers'

      - name: Package for Linux
        if: matrix.packager
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RPM_WEBKIT: ${{ matrix.webkit }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION
          mkdir -p dist
          nfpm package --config build/linux/nfpm.yaml --packager "${{ matrix.packager }}" \
            --target "dist/GitRevenge-$VERSION-${{ matrix.package }}"

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign app bundle
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app=$(ls -d build/bin/*.app)
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist staging
          cp -R build/bin/*.app "staging/Git Revenge.app"
          ln -s /Applications staging/Applications
          # hdiutil sizes the image from the folder and can come up short ("No space left on
          # device"), so it's given the folder's size and room to spare.
          size=$(( $(du -sm staging | cut -f1) + 64 ))
          hdiutil create -volname "Git Revenge" -srcfolder staging -ov -format UDZO -size "${size}m" \
            "dist/GitRevenge-${{ steps.version.outputs.version }}-macos-universal.dmg"

      - name: Notarize disk image
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls dist/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          # Notarize with an App Store Connect API key (a Team key), not an Apple ID.
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          rm "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  verify-linux:
    # Installs each package on what it supports and starts the app, so a wrong dependency or a
    # missing library stops the release instead of reaching someone's machine.
    name: Install on ${{ matrix.image }}
    needs: build
    # Not held back by another platform's build, such as no macOS runner being free. Publishing
    # still needs every build to have passed. A package that didn't build fails here too.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 isn't here: its git is 2.47 and the package needs 2.50 (ADR-0010).
          - image: ubuntu:24.04
            artifact: release-deb
          - image: almalinux:9
            artifact: release-el9
          - image: almalinux:10
            artifact: release-el10
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the package
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            # Ubuntu 24.04's own git is 2.43 and the package needs 2.50: the install guide has
            # people add the Git maintainers' PPA first, and so does this.
            apt-get install -y software-properties-common
            add-apt-repository -y ppa:git-core/ppa
            apt-get install -y ./dist/*.deb xvfb xauth desktop-file-utils
          else
            if [ "${{ matrix.image }}" = "almalinux:10" ]; then
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
              # RHEL 10 has no X server, so there's no Xvfb. Weston runs headless on Wayland.
              dnf install -y ./dist/*.rpm weston desktop-file-utils
            else
              dnf install -y ./dist/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth which desktop-file-utils
            fi
          fi
      - name: Check what was installed
        run: |
          ldd /usr/bin/gitrevenge | tee ldd.txt
          if grep 'not found' ldd.txt; then exit 1; fi
          desktop-file-validate /usr/share/applications/gitrevenge.desktop
          git --version
      - name: Start the app
        env:
          # WebKit's sandbox can't start inside a container.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          HOME: /tmp/home
          XDG_RUNTIME_DIR: /tmp/xdg
        run: |
          mkdir -p "$HOME"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          status=0
          if command -v weston >/dev/null; then
            weston --backend=headless --socket=wl-check &
            sleep 5
            WAYLAND_DISPLAY=wl-check GDK_BACKEND=wayland timeout 20 gitrevenge || status=$?
          else
            timeout 20 xvfb-run -a gitrevenge || status=$?
          fi
          # 124 means it was still running when the timeout stopped it.
          if [ "$status" != 124 ]; then
            echo "::error::The app exited with $status"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, verify-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: a signing identity for this run, and leave to store
      # what it signs. Only this job has them; the build jobs don't.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # A signed statement, for each file about to be published, that this workflow built it
      # from this tag's commit. `gh attestation verify <file> --repo <this repo>` checks it.
      # Before the release is created: a file that can't be attested isn't published.
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Git Revenge ${GITHUB_REF_NAME}" --generate-notes $prerelease
      # The apt/dnf repo and the Homebrew tap follow releases/latest every six hours anyway;
      # this makes them pick up a stable release at once. GITHUB_TOKEN can't dispatch to other
      # repos, so it takes a fine-grained token with Contents: read and write on both. Without
      # it the step is skipped, and a failed dispatch only warns.
      - name: Tell the package repos
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PACKAGE_REPOS_TOKEN is not set; the package repos will catch up on their schedules"
            exit 0
          fi
          for repo in Git-Revenge/packages Git-Revenge/homebrew-tap; do
            gh api "repos/$repo/dispatches" -f event_type=release -f "client_payload[tag]=$GITHUB_REF_NAME" \
              || echo "::warning::Could not notify $repo; it will catch up on its schedule"
          done

  # Opens a pull request on microsoft/winget-pkgs for a stable release, from a fork of it under
  # the maintainer's account. It needs WINGET_TOKEN (see docs/RELEASING.md) and a package
  # already in winget, so the first version is submitted by hand. A failure only warns: winget
  # can be updated by hand later without touching the release.
  winget:
    name: Update winget
    needs: release
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::WINGET_TOKEN is not set; submit the winget update by hand (docs/RELEASING.md)"
          fi
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: steps.token.outputs.set == 'true'
        continue-on-error: true
        with:
          identifier: GitRevenge.GitRevenge
          installers-regex: '-windows-amd64-installer\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: risadams-bot
