name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Dry run: build and package (unsigned) without publishing when this workflow changes.
  pull_request:
    paths: [.github/workflows/release.yml, build/linux/**]

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NFPM_VERSION: v2.48.0

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          # Each Linux package is built on the oldest system it supports. The .deb's glibc and
          # WebKitGTK suit Debian 13 too. RHEL 9 only has WebKitGTK 4.0, and RHEL 10 only has
          # 4.1, from EPEL, so they can't share a package. AlmaLinux stands in for RHEL.
          - name: deb
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            packager: deb
            package: linux-amd64.deb
          - name: el9
            os: ubuntu-24.04
            container: almalinux:9
            platform: linux/amd64
            webkit_devel: webkit2gtk3-devel
            webkit: webkit2gtk3
            packager: rpm
            package: el9.x86_64.rpm
          - name: el10
            os: ubuntu-24.04
            container: almalinux:10
            platform: linux/amd64
            tags: webkit2_41
            webkit_devel: webkit2gtk4.1-devel
            webkit: webkit2gtk4.1
            packager: rpm
            package: el10.x86_64.rpm
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # macOS signing and notarization run only when the Apple secrets are configured;
    # otherwise the .dmg is published unsigned. Only this flag is job-wide: the secrets
    # themselves are scoped to the steps that use them, never to npm or go install steps.
    env:
      MAC_SIGNING: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
      # A container runs as root, but the checkout belongs to the runner's user, so Go can't
      # read its VCS information.
      GOFLAGS: ${{ matrix.container && '-buildvcs=false' || '' }}
    steps:
      - name: Install GTK and WebKitGTK
        if: matrix.packager == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install build dependencies
        if: matrix.packager == 'rpm'
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          if [ "${{ matrix.name }}" = "el10" ]; then dnf install -y epel-release; fi
          dnf install -y git tar gzip xz gcc pkgconf-pkg-config gtk3-devel ${{ matrix.webkit_devel }}

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dryrun"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not semver"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stamp the version into wails.json so installer and bundle metadata match the tag.
          # Windows file versions must be numeric, so pre-release suffixes are dropped there.
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wails.json"));
            c.info.productVersion = process.argv[1].split("-")[0];
            fs.writeFileSync("wails.json", JSON.stringify(c, null, 2) + "\n");
          ' "$version"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          # Chocolatey doesn't update PATH for later steps, and Wails only warns if makensis is missing.
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          args=(-clean -platform "${{ matrix.platform }}" -ldflags "-X github.com/git-revenge/gitrevenge/internal/version.Version=${{ steps.version.outputs.version }}")
          if [ "$RUNNER_OS" = "Windows" ]; then args+=(-nsis); fi
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          wails build "${args[@]}"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/*-installer.exe "dist/GitRevenge-${{ steps.version.outputs.version }}-windows-amd64-installer.exe"

      - name: Package for Linux
        if: matrix.packager
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RPM_WEBKIT: ${{ matrix.webkit }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION
          mkdir -p dist
          nfpm package --config build/linux/nfpm.yaml --packager "${{ matrix.packager }}" \
            --target "dist/GitRevenge-$VERSION-${{ matrix.package }}"

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign app bundle
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app=$(ls -d build/bin/*.app)
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist staging
          cp -R build/bin/*.app "staging/Git Revenge.app"
          ln -s /Applications staging/Applications
          hdiutil create -volname "Git Revenge" -srcfolder staging -ov -format UDZO \
            "dist/GitRevenge-${{ steps.version.outputs.version }}-macos-universal.dmg"

      - name: Notarize disk image
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls dist/*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          # Notarize with an App Store Connect API key (a Team key), not an Apple ID.
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          rm "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  verify-linux:
    # Installs each package on what it supports and starts the app, so a wrong dependency or a
    # missing library stops the release instead of reaching someone's machine.
    name: Install on ${{ matrix.image }}
    needs: build
    # Not held back by another platform's build, such as no macOS runner being free. Publishing
    # still needs every build to have passed. A package that didn't build fails here too.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            artifact: release-deb
          - image: debian:13
            artifact: release-deb
          - image: almalinux:9
            artifact: release-el9
          - image: almalinux:10
            artifact: release-el10
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the package
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y ./dist/*.deb xvfb xauth desktop-file-utils
          else
            if [ "${{ matrix.image }}" = "almalinux:10" ]; then
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
              # RHEL 10 has no X server, so there's no Xvfb. Weston runs headless on Wayland.
              dnf install -y ./dist/*.rpm weston desktop-file-utils
            else
              dnf install -y ./dist/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth which desktop-file-utils
            fi
          fi
      - name: Check what was installed
        run: |
          ldd /usr/bin/gitrevenge | tee ldd.txt
          if grep 'not found' ldd.txt; then exit 1; fi
          desktop-file-validate /usr/share/applications/gitrevenge.desktop
          git --version
      - name: Start the app
        env:
          # WebKit's sandbox can't start inside a container.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
          HOME: /tmp/home
          XDG_RUNTIME_DIR: /tmp/xdg
        run: |
          mkdir -p "$HOME"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          status=0
          if command -v weston >/dev/null; then
            weston --backend=headless --socket=wl-check &
            sleep 5
            WAYLAND_DISPLAY=wl-check GDK_BACKEND=wayland timeout 20 gitrevenge || status=$?
          else
            timeout 20 xvfb-run -a gitrevenge || status=$?
          fi
          # 124 means it was still running when the timeout stopped it.
          if [ "$status" != 124 ]; then
            echo "::error::The app exited with $status"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: [build, verify-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Git Revenge ${GITHUB_REF_NAME}" --generate-notes $prerelease
      # The apt/dnf repo and the Homebrew tap follow releases/latest every six hours anyway;
      # this makes them pick up a stable release at once. GITHUB_TOKEN can't dispatch to other
      # repos, so it takes a fine-grained token with Contents: read and write on both. Without
      # it the step is skipped, and a failed dispatch only warns.
      - name: Tell the package repos
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PACKAGE_REPOS_TOKEN is not set; the package repos will catch up on their schedules"
            exit 0
          fi
          for repo in Git-Revenge/packages Git-Revenge/homebrew-tap; do
            gh api "repos/$repo/dispatches" -f event_type=release -f "client_payload[tag]=$GITHUB_REF_NAME" \
              || echo "::warning::Could not notify $repo; it will catch up on its schedule"
          done
