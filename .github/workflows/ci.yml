name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:browser:webkit
      - run: npm run build
      - run: npm run bundle-budget

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # main.go embeds frontend/dist, so the frontend must be built before any Go tooling.
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - run: go vet ./...
      - name: go test
        shell: bash
        # The race detector needs cgo: macOS and Linux runners have a compiler, Windows
        # runners have no gcc.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then go test ./...; else go test -race ./...; fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        run: wails build -s
      - name: Wails build (macOS universal)
        if: runner.os == 'macOS'
        run: wails build -s -platform darwin/universal
      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -s -platform linux/amd64 -tags webkit2_41

  rhel:
    # AlmaLinux stands in for RHEL. Each version gets its own package, because RHEL 9 only has
    # WebKitGTK 4.0, a separate code path in Wails, and RHEL 10 only has 4.1, from EPEL.
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EL9
            image: almalinux:9
            webkit: webkit2gtk3-devel
            tags: ""
          - name: EL10
            image: almalinux:10
            webkit: webkit2gtk4.1-devel
            tags: webkit2_41
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      # The container runs as root, but the checkout belongs to the runner's user, so Go
      # can't read its VCS information.
      GOFLAGS: -buildvcs=false
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          if [ "${{ matrix.name }}" = "EL10" ]; then dnf install -y epel-release; fi
          dnf install -y git tar gzip xz gcc pkgconf-pkg-config gtk3-devel ${{ matrix.webkit }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Wails build
        run: wails build -s -platform linux/amd64 -tags "${{ matrix.tags }}"
